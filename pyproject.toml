# Este archivo solo configura herramientas de desarrollo. Las dependencias siguen en requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["hub/migrations", ".venv"]

[tool.ruff.format]
# El código existente usa comillas simples; se conservan para que el formato no cambie cada cadena.
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
